e="책을 덮고도 쉽게 떠나지 않는 장면이 있습니다. 독서가 끝났다고 생각한 순간부터, 오히려 질문은 시작되었습니다."><text font-family="IBM Plex Sans KR, Noto Sans KR, sans-serif" font-size="17" font-weight="400" fill="#242424" ><tspan x="0" y="19.040000000000003">책을 덮고도 쉽게 떠나지 않는 장면이 있습니다.</tspan><tspan x="0" y="45.040000000000006">독서가 끝났다고 생각한 순간부터, 오히려 질문</tspan><tspan x="0" y="71.04">은 시작되었습니다.</tspan></text></g></g><g transform="translate(16,711)"><g data-name="기억에 남은 생각"><rect width="358" height="156" rx="0" fill="#F4F4F4" stroke="none"/><g transform="translate(16,16)"><g data-name="기억은 과거를 보관하는 일에 그치지 않고, 오늘을 살아가는 태도가 될 수도 있겠다고 생각했다."><text font-family="IBM Plex Sans KR, Noto Sans KR, sans-serif" font-size="20" font-weight="700" fill="#242424" ><tspan x="0" y="22.400000000000002">기억은 과거를 보관하는 일에 그치지</tspan><tspan x="0" y="52.400000000000006">않고, 오늘을 살아가는 태도가 될 수</tspan><tspan x="0" y="82.4">도 있겠다고 생각했다.</tspan></text></g></g><g transform="translate(16,122)"><g data-name="독자의 생각을 정리한 예시 · 실제 도서 인용 아님"><text font-family="IBM Plex Sans KR, Noto Sans KR, sans-serif" font-size="12" font-weight="400" fill="#666666" ><tspan x="0" y="13.440000000000001">독자의 생각을 정리한 예시 · 실제 도서 인용 아님</tspan></text></g></g></g></g><g transform="translate(16,891)"><g data-name="이번 독서에서 가장 오래 남은 것은 한 사람의 목소리를 듣는 마음이었습니다. 어떤 이야기는 빠르게 이해하기보다 충분히 곁에 머물러야 한다는 생각이 들었습니다."><text font-family="IBM Plex Sans KR, Noto Sans KR, sans-serif" font-size="17" font-weight="400" fill="#242424" ><tspan x="0" y="19.040000000000003">이번 독서에서 가장 오래 남은 것은 한 사람의 목</tspan><tspan x="0" y="45.040000000000006">소리를 듣는 마음이었습니다. 어떤 이야기는 빠</tspan><tspan x="0" y="71.04">르게 이해하기보다 충분히 곁에 머물러야 한다는</tspan><tspan x="0" y="97.04">생각이 들었습니다.</tspan><tspan x="0" y="123.04"></tspan><tspan x="0" y="149.04">다시 읽게 된다면 같은 장면에서 또 다른 질문을</tspan><tspan x="0" y="175.04">만나게 될 것 같습니다. 여러분에게는 어떤 장면</tspan><tspan x="0" y="201.04">이 오래 남았나요?</tspan></text></g></g><g transform="translate(16,1123)"><g data-name="기록한 쪽수 32–68p"><text font-family="IBM Plex Sans KR, Noto Sans KR, sans-serif" fon